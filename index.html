<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>초밥밥 취사</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fafafa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="초밥밥 취사">
<style>
  :root{
    --bg:#fafafa;
    --card:#ffffff;
    --line:#ececec;
    --text:#1a1a1a;
    --sub:#8f8f8f;
    --green:#1f8a4c;
    --green-light:#e6f4ea;
    --kakao:#FEE500;
    --kakao-text:#3c1e1e;
    --summary-bg:#f4f4f5;
    font-size: clamp(16px, 4.6vw, 20px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--text);
  }
  .app{max-width:480px; margin:0 auto; min-height:100%; background:var(--bg); padding-bottom:22px;}

  header{
    padding:16px 16px 10px; position:relative;
  }
  .back-btn{
    position:absolute; top:16px; left:14px; background:none; border:none;
    font-size:1.4rem; color:var(--text); cursor:pointer; padding:4px 8px; line-height:1;
  }
  .header-title{
    display:flex; align-items:center; justify-content:center; gap:8px; padding-top:2px;
  }
  .header-title .icon{font-size:1.5rem;}
  .header-title h1{margin:0; font-size:1.25rem; font-weight:800;}

  .recipe-pill{
    margin:14px auto 0; display:flex; justify-content:center; align-items:center; gap:10px;
    background:#fff; border:1.5px solid var(--green); border-radius:30px; padding:9px 18px;
    max-width:360px; width:fit-content;
  }
  .recipe-pill b{color:#000; font-weight:800; font-size:0.86rem;}
  .recipe-pill .sep{color:#c9c9c9; font-weight:400;}

  .wrap{padding:14px 12px 4px;}

  .step-card{
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:14px; margin-bottom:12px; display:flex; align-items:stretch; gap:10px;
  }
  .photo-wrap{
    width:32%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .photo-frame{
    width:100%; aspect-ratio:1/1; border-radius:16px; background:#f0f0f2;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    border:1px solid var(--line); position:relative;
  }
  .photo-frame img{width:100%; height:100%; object-fit:cover;}
  .photo-frame .placeholder{font-size:2rem; color:#d5d5d7;}
  .photo-frame .ref-img{opacity:0.9;}
  .photo-frame{cursor:pointer;}
  .photo-frame::after{content:'📷';position:absolute;right:7px;bottom:7px;width:30px;height:30px;border-radius:50%;background:rgba(31,138,76,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .quick-actions{display:flex;gap:7px;padding:4px 12px 10px;position:sticky;top:57px;background:var(--bg);z-index:19}
  .quick-btn{flex:1;border:1.5px solid var(--green);background:#fff;color:var(--green);border-radius:14px;padding:10px 4px;font-weight:800;font-size:.78rem}
  .quick-btn.done{background:var(--green-light);}
  .camera-btn{display:none!important;}
  .ref-badge{
    position:absolute; top:6px; left:6px; background:rgba(0,0,0,0.55); color:#fff;
    font-size:0.56rem; font-weight:700; padding:2px 7px; border-radius:8px;
  }

  .time-col{
    width:26%; flex-shrink:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; gap:2px;
  }
  .time-label{font-size:0.68rem; color:var(--sub); font-weight:600;}
  .time-value{font-size:1.35rem; font-weight:800; color:var(--text); line-height:1.1;}
  .time-note{font-size:0.62rem; color:#b3b3b3;}
  .elapsed-badge{
    display:inline-block; margin-top:4px; background:var(--green-light); color:var(--green);
    font-size:0.62rem; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;
  }

  .info-col{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:flex-start;}
  .info-top{display:flex; align-items:center; gap:8px;}
  .step-circle{
    width:24px; height:24px; border-radius:50%; background:var(--green); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.78rem; flex-shrink:0;
  }
  .step-title{font-weight:800; font-size:0.98rem;}
  .step-desc{font-size:0.76rem; color:#555; margin-top:5px; line-height:1.45;}
  .camera-btn{
    margin-top:auto; padding-top:9px; background:#fff; border:1.5px solid var(--green); border-radius:30px;
    padding:9px 10px; font-size:0.82rem; font-weight:700; color:var(--text); width:100%;
    display:flex; align-items:center; justify-content:center; gap:7px; text-align:center;
  }
  .camera-btn .cam-ic{
    width:20px; height:20px; border-radius:50%; background:var(--green); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:0.7rem; flex-shrink:0;
  }
  .camera-btn.done{background:var(--green-light); border-color:var(--green); color:var(--green);}
  .camera-btn.done .cam-ic{background:var(--green);}
  input[type=file]{display:none;}

  .summary-card{
    background:var(--summary-bg); border-radius:22px;
    padding:14px 14px 10px; margin:14px 0 10px;
  }
  .summary-title{font-weight:800; font-size:0.82rem; margin-bottom:10px; display:flex; align-items:center; gap:5px;}
  .timeline{display:flex; align-items:flex-start; overflow-x:auto; gap:2px;}
  .tl-item{flex-shrink:0; text-align:center; min-width:60px;}
  .tl-item .lbl{font-size:0.58rem; color:var(--sub); font-weight:700;}
  .tl-item .tm{font-size:0.94rem; font-weight:800; color:var(--text); margin-top:3px;}
  .tl-item .cnt{font-size:0.56rem; color:#a8a8a8; margin-top:2px;}
  .tl-arrow{flex-shrink:0; color:#c7c7c9; font-size:0.8rem; padding-top:18px;}

  .kakao-btn{
    width:calc(100% - 24px); margin:6px auto 0; display:flex; align-items:center; gap:12px;
    padding:14px 16px; border:none; border-radius:20px; background:var(--kakao); cursor:pointer;
  }
  .kakao-btn:disabled{opacity:0.45;}
  .talk-badge{
    width:38px; height:38px; border-radius:50%; background:#1a1a1a; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:0.6rem; font-weight:800; flex-shrink:0;
  }
  .kakao-text{text-align:left;}
  .kakao-text .main{font-size:0.98rem; font-weight:800; color:var(--kakao-text);}
  .kakao-text .sub{font-size:0.68rem; color:#6b5a1a; margin-top:2px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--text); color:#fff; padding:12px 20px; border-radius:30px;
    font-size:0.85rem; z-index:100; opacity:0; transition:opacity .25s; pointer-events:none; text-align:center;
    max-width:88%;
  }
  .toast.show{opacity:1;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.4); display:none;
    align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff; border-radius:18px; padding:24px 20px; width:100%; max-width:320px; text-align:center;
  }
  .modal h3{margin:0 0 14px; font-size:1rem;}
  .modal input{
    width:100%; padding:14px; font-size:1.4rem; text-align:center; letter-spacing:6px;
    border:1.5px solid var(--line); border-radius:10px; margin-bottom:14px;
  }
  .modal-buttons{display:flex; gap:10px;}
  .modal-buttons button{flex:1; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.95rem;}
  .modal-cancel{background:#f0f0f0; color:#555;}
  .modal-confirm{background:var(--text); color:#fff;}

  .history-panel{display:none; margin:0 12px 14px;}
  .history-panel.open{display:block;}
  .history-panel h2{font-size:0.85rem; display:flex; justify-content:space-between; align-items:center; margin:0 0 8px;}
  .history-panel h2 button{background:none; border:none; color:var(--sub); font-size:0.75rem;}
  .history-date{font-size:0.72rem; color:var(--sub); font-weight:800; margin:10px 0 6px 2px;}
  .history-item{
    font-size:0.74rem; color:#555; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:9px 12px; margin-bottom:6px; line-height:1.6;
  }
  .history-item b{color:var(--text);}
  .history-share-btn{
    display:block; margin-top:7px; background:var(--text); color:#fff; border:none;
    border-radius:8px; padding:6px 10px; font-size:0.7rem; font-weight:700; width:fit-content;
  }

  .rice-tabs{display:flex;gap:8px;padding:8px 12px 4px;position:sticky;top:0;background:var(--bg);z-index:20}
  .rice-tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:16px;padding:11px 4px;font-weight:800;font-size:.88rem}
  .rice-tab.active{background:var(--green);color:#fff;border-color:var(--green)}
  .rice-panel{display:none}.rice-panel.active{display:block}
  .rice-heading{text-align:center;font-weight:900;font-size:1.05rem;margin:8px 0 2px}
  .reset-btn{display:block;margin:10px auto;border:0;background:none;color:#999;font-size:.72rem;text-decoration:underline}

  /* 솥별 색상 구분 */
  .rice-tab:nth-child(1){border-color:#1f8a4c;color:#1f8a4c}.rice-tab:nth-child(1).active{background:#1f8a4c;color:#fff}
  .rice-tab:nth-child(2){border-color:#2563eb;color:#2563eb}.rice-tab:nth-child(2).active{background:#2563eb;color:#fff}
  .rice-tab:nth-child(3){border-color:#3b2a1e;color:#3b2a1e}.rice-tab:nth-child(3).active{background:#3b2a1e;color:#fff}
  #rice1{--rice:#1f8a4c;--rice-light:#e6f4ea} #rice2{--rice:#2563eb;--rice-light:#eaf1ff} #rice3{--rice:#3b2a1e;--rice-light:#eee7e1}
  .rice-panel .quick-btn{border-color:var(--rice);color:var(--rice)} .rice-panel .quick-btn.done{background:var(--rice-light)}
  .rice-panel .step-circle{background:var(--rice)} .rice-panel .elapsed-badge{background:var(--rice-light);color:var(--rice)}
  .rice-panel .summary-card{border:1px solid var(--rice);background:var(--rice-light)}
  .rice-panel .rice-heading{color:var(--rice)}
</style></head><body><div class="app"><header><div class="recipe-pill"><b>쌀 3.5kg</b><span class="sep">|</span><b>물 4.5kg</b><span class="sep">|</span><b>초대리 1L</b></div></header><div class="rice-tabs" id="tabs"></div><div id="panels"></div></div><div class="toast" id="toast"></div><script>

const STEP_LABELS=['쌀 계량','취사 시작','초대리 섞기','최종 섞기'];
const DESCS=['쌀 3.5kg 계량<br>씻고 소쿠리에 받쳐 물기 빼기','물 4.5kg 넣고 취사 시작','60분 후 밥을 꺼내<br>초대리 1L 넣고 골고루 섞기','5분 후 전체적으로<br>뒤집어 골고루 섞기'];
const state={1:{},2:{},3:{}}; let db;
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open('sushiRiceDB3',1);r.onupgradeneeded=e=>{const d=e.target.result;d.createObjectStore('draft',{keyPath:'key'});d.createObjectStore('reports',{keyPath:'id'})};r.onsuccess=e=>ok(e.target.result);r.onerror=no})}
function put(store,v){if(!db)return Promise.resolve();return new Promise((ok,no)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(v);t.oncomplete=ok;t.onerror=no})}
function all(store){if(!db)return Promise.resolve([]);return new Promise((ok,no)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=no})}
function del(key){if(!db)return Promise.resolve();return new Promise((ok,no)=>{const t=db.transaction('draft','readwrite');t.objectStore('draft').delete(key);t.oncomplete=ok;t.onerror=no})}
function hm(x){const d=new Date(x);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function mins(a,b){return Math.round((new Date(b)-new Date(a))/60000)}
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function ref(i){const refs={1:REF_IMG_1,2:REF_IMG_2,3:REF_IMG_3,4:REF_IMG_4};return refs[i]||''}
function make(){
 document.getElementById('tabs').innerHTML=[1,2,3].map(r=>`<button class="rice-tab ${r===1?'active':''}" onclick="showRice(${r})">${r}번 밥</button>`).join('');
 document.getElementById('panels').innerHTML=[1,2,3].map(r=>`<section class="rice-panel ${r===1?'active':''}" id="rice${r}"><div class="wrap">${[1,2,3,4].map(i=>card(r,i)).join('')}<div class="summary-card"><div class="summary-title">🕒 ${r}번 기록 요약</div><div class="timeline">${[1,2,3,4].map((i,k)=>`${k?'<div class="tl-arrow">&gt;</div>':''}<div class="tl-item"><div class="lbl">${STEP_LABELS[i-1]}</div><div class="tm" id="tl-${r}-${i}">--:--</div><div class="cnt" id="cnt-${r}-${i}">사진 0장</div></div>`).join('')}</div></div><button class="kakao-btn" id="share-${r}" disabled onclick="shareRice(${r})"><span class="talk-badge">TALK</span><span class="kakao-text"><div class="main">${r}번 밥 공유하기</div><div class="sub">사진 4장 + 기록 요약 이미지를 함께 공유합니다.</div></span></button><button class="reset-btn" onclick="resetRice(${r})">${r}번 기록 초기화</button></div></section>`).join('');
 [1,2,3].forEach(r=>[1,2,3,4].forEach(i=>{const inp=document.getElementById(`in-${r}-${i}`);inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const time=new Date().toISOString();state[r][i]={blob:f,time};await put('draft',{key:`${r}-${i}`,rice:r,step:i,blob:f,time});render(r,i);inp.value=''}}));
}
function card(r,i){return `<div class="step-card"><div class="photo-wrap"><div class="photo-frame" id="fr-${r}-${i}" onclick="shoot(${r},${i})">${ref(i)?`<img class="ref-img" src="${ref(i)}"><span class="ref-badge">예시</span>`:`<span class="placeholder">📷</span><span class="ref-badge">촬영</span>`}</div></div><div class="time-col"><div class="time-label">촬영시간</div><div class="time-value" id="tm-${r}-${i}">--:--</div><div class="time-note">자동 입력</div><div class="elapsed-badge" id="bd-${r}-${i}" style="display:none"></div></div><div class="info-col"><div class="info-top"><div class="step-circle">${i}</div><div class="step-title">${STEP_LABELS[i-1]}</div></div><div class="step-desc">${DESCS[i-1]}</div><label class="camera-btn" id="bt-${r}-${i}" for="in-${r}-${i}"><span class="cam-ic">📷</span>사진 찍기</label><input type="file" id="in-${r}-${i}" accept="image/*" capture="environment"></div></div>`}
function shoot(r,i){const el=document.getElementById(`in-${r}-${i}`);if(el)el.click()}
function showRice(r){document.querySelectorAll('.rice-tab').forEach((x,i)=>x.classList.toggle('active',i===r-1));document.querySelectorAll('.rice-panel').forEach((x,i)=>x.classList.toggle('active',i===r-1));history.replaceState(null,'',location.pathname+location.search.split('&rice=')[0]+(location.search?'&':'?')+'rice='+r)}
function render(r,i){const s=state[r][i],fr=document.getElementById(`fr-${r}-${i}`),bt=document.getElementById(`bt-${r}-${i}`);if(s){fr.innerHTML=`<img src="${URL.createObjectURL(s.blob)}">`;document.getElementById(`tm-${r}-${i}`).textContent=hm(s.time);bt.innerHTML='<span class="cam-ic">✓</span>촬영 완료';bt.classList.add('done')}else{fr.innerHTML=`${ref(i)?`<img class="ref-img" src="${ref(i)}"><span class="ref-badge">예시</span>`:`<span class="placeholder">📷</span><span class="ref-badge">촬영</span>`}`;document.getElementById(`tm-${r}-${i}`).textContent='--:--';bt.innerHTML='<span class="cam-ic">📷</span>사진 찍기';bt.classList.remove('done')}document.getElementById(`tl-${r}-${i}`).textContent=s?hm(s.time):'--:--';document.getElementById(`cnt-${r}-${i}`).textContent=s?'사진 1장':'사진 0장';if(i>=3){const b=document.getElementById(`bd-${r}-${i}`),p=state[r][i-1];if(s&&p){b.style.display='inline-block';b.textContent=i===3?`취사 후 ${mins(p.time,s.time)}분`:`3단계 후 ${mins(p.time,s.time)}분`}else b.style.display='none'}const qb=document.getElementById(`qb-${r}-${i}`);if(qb)qb.classList.toggle('done',!!s);document.getElementById(`share-${r}`).disabled=![1,2,3,4].every(x=>state[r][x])}
async function makeSummaryFile(r){const S=state[r],c=document.createElement('canvas');c.width=1080;c.height=1080;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#111';x.font='bold 52px sans-serif';x.fillText(`🍚 ${r}번밥 취사`,60,90);x.fillStyle='#888';x.font='34px sans-serif';x.fillText(new Date().toLocaleDateString('ko-KR'),60,145);x.fillStyle='#000';x.font='bold 32px sans-serif';x.fillText('쌀 3.5kg · 물 4.5kg · 초대리 1L',60,210);x.strokeStyle='#eee';x.lineWidth=3;x.beginPath();x.moveTo(60,255);x.lineTo(1020,255);x.stroke();const ys=[350,480,610,740];x.fillStyle='#555';x.font='36px sans-serif';STEP_LABELS.forEach((v,k)=>x.fillText(v,60,ys[k]));x.fillStyle='#111';x.font='bold 48px sans-serif';[1,2,3,4].forEach((i,k)=>x.fillText(hm(S[i].time),570,ys[k]));x.strokeStyle='#eee';x.beginPath();x.moveTo(60,810);x.lineTo(1020,810);x.stroke();x.fillStyle='#e6f4ea';x.fillRect(60,845,960,170);x.fillStyle='#1f8a4c';x.font='bold 32px sans-serif';x.fillText(`취사 → 초대리 섞기: ${mins(S[2].time,S[3].time)}분`,90,910);x.fillText(`초대리 섞기 → 최종 섞기: ${mins(S[3].time,S[4].time)}분`,90,970);const blob=await new Promise(ok=>c.toBlob(ok,'image/png'));return new File([blob],`rice${r}-summary.png`,{type:'image/png'})}
async function shareRice(r){const S=state[r];const text=`[${r}번 초밥밥 취사]\n\n${[1,2,3,4].map(i=>STEP_LABELS[i-1]+'   '+hm(S[i].time)).join('\n')}\n\n취사 → 초대리 섞기: ${mins(S[2].time,S[3].time)}분\n초대리 섞기 → 최종 섞기: ${mins(S[3].time,S[4].time)}분`;const files=[1,2,3,4].map(i=>new File([S[i].blob],`rice${r}-step${i}.jpg`,{type:S[i].blob.type||'image/jpeg'}));files.push(await makeSummaryFile(r));let shared=false;
if(navigator.share){
 try{await navigator.share({title:`${r}번 초밥밥 취사`,text,files});shared=true}
 catch(e1){
  try{await navigator.share({title:`${r}번 초밥밥 취사`,text});shared=true}
  catch(e2){}
 }
}
if(!shared){try{await navigator.clipboard.writeText(text);toast('내용이 복사되었습니다')}catch(e3){}}
await put('reports',{id:Date.now(),rice:r,createdAt:new Date().toISOString()});await resetRice(r);toast(`${r}번 밥 완료`)}
async function resetRice(r){for(let i=1;i<=4;i++){state[r][i]=null;await del(`${r}-${i}`);render(r,i)}}
(async()=>{make();try{db=await openDB()}catch(e){db=null}const rows=await all('draft');rows.forEach(x=>state[x.rice][x.step]={blob:x.blob,time:x.time});[1,2,3].forEach(r=>[1,2,3,4].forEach(i=>render(r,i)));const q=Number(new URLSearchParams(location.search).get('rice'));if(q>=1&&q<=3)showRice(q)})();if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script></body></html>
